<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
  </defs>
  
  <!-- Warehouse structure -->
  <path d="M6 28L24 12L42 28" stroke="url(#brandGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="9" y="28" width="30" height="16" rx="1.5" stroke="url(#brandGradient)" stroke-width="2.5" fill="none"/>
  
  <!-- Warehouse shelves/boxes inside -->
  <rect x="13" y="32" width="8" height="5" rx="1" fill="#3B82F6" opacity="0.6"/>
  <rect x="23" y="32" width="8" height="5" rx="1" fill="#3B82F6" opacity="0.8"/>
  <rect x="13" y="38" width="8" height="4" rx="1" fill="#3B82F6" opacity="0.8"/>
  <rect x="23" y="38" width="8" height="4" rx="1" fill="#3B82F6" opacity="0.6"/>
  
  <!-- Magnifying glass lens overlay -->
  <circle cx="34" cy="22" r="10" stroke="url(#brandGradient)" stroke-width="3" fill="white" fill-opacity="0.4"/>
  <line x1="41.5" y1="29.5" x2="46" y2="34" stroke="url(#brandGradient)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Lens glint -->
  <path d="M29 17 Q32 14, 35 17" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>
</svg>
