<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" fill="none">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>
  
  <!-- Icon: Warehouse with lens -->
  <g transform="translate(0, 2)">
    <!-- Warehouse structure -->
    <path d="M4 24L16 14L28 24" stroke="url(#brandGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="6" y="24" width="20" height="11" rx="1" stroke="url(#brandGradient)" stroke-width="2" fill="none"/>
    
    <!-- Warehouse shelves/boxes inside -->
    <rect x="9" y="27" width="5" height="3" rx="0.5" fill="#60A5FA" opacity="0.5"/>
    <rect x="16" y="27" width="5" height="3" rx="0.5" fill="#60A5FA" opacity="0.7"/>
    <rect x="9" y="31" width="5" height="3" rx="0.5" fill="#60A5FA" opacity="0.7"/>
    <rect x="16" y="31" width="5" height="3" rx="0.5" fill="#60A5FA" opacity="0.5"/>
    
    <!-- Magnifying glass lens overlay -->
    <circle cx="24" cy="20" r="7" stroke="url(#brandGradient)" stroke-width="2.5" fill="#0f172a" fill-opacity="0.5"/>
    <line x1="29" y1="25" x2="34" y2="30" stroke="url(#brandGradient)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Lens glint -->
    <path d="M20 16 Q22 14, 24 16" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
  
  <!-- Text: WareHouseLens -->
  <text x="42" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">
    <tspan fill="#60A5FA">Ware</tspan><tspan fill="#f1f5f9">House</tspan><tspan fill="#60A5FA">Lens</tspan>
  </text>
</svg>
