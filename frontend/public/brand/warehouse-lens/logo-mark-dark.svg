<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>
  
  <!-- Warehouse structure -->
  <path d="M5 24L20 11L35 24" stroke="url(#brandGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="8" y="24" width="24" height="13" rx="1.5" stroke="url(#brandGradient)" stroke-width="2" fill="none"/>
  
  <!-- Warehouse shelves/boxes inside -->
  <rect x="11" y="27" width="7" height="4" rx="0.5" fill="#60A5FA" opacity="0.5"/>
  <rect x="20" y="27" width="7" height="4" rx="0.5" fill="#60A5FA" opacity="0.7"/>
  <rect x="11" y="32" width="7" height="3.5" rx="0.5" fill="#60A5FA" opacity="0.7"/>
  <rect x="20" y="32" width="7" height="3.5" rx="0.5" fill="#60A5FA" opacity="0.5"/>
  
  <!-- Magnifying glass lens overlay -->
  <circle cx="29" cy="19" r="8" stroke="url(#brandGradient)" stroke-width="2.5" fill="#0f172a" fill-opacity="0.5"/>
  <line x1="35" y1="25" x2="39" y2="29" stroke="url(#brandGradient)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Lens glint -->
  <path d="M25 15 Q27 13, 29 15" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
