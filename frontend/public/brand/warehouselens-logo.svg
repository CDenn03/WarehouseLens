<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" fill="none">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
  </defs>
  
  <!-- Icon: Warehouse with lens -->
  <g>
    <!-- Warehouse structure -->
    <path d="M6 32L20 20L34 32" stroke="url(#brandGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="8" y="32" width="24" height="14" rx="1" stroke="url(#brandGradient)" stroke-width="2" fill="none"/>
    
    <!-- Warehouse shelves/boxes inside -->
    <rect x="11" y="35" width="6" height="4" rx="0.5" fill="#3B82F6" opacity="0.6"/>
    <rect x="19" y="35" width="6" height="4" rx="0.5" fill="#3B82F6" opacity="0.8"/>
    <rect x="11" y="40" width="6" height="4" rx="0.5" fill="#3B82F6" opacity="0.8"/>
    <rect x="19" y="40" width="6" height="4" rx="0.5" fill="#3B82F6" opacity="0.6"/>
    
    <!-- Magnifying glass lens overlay -->
    <circle cx="28" cy="28" r="8" stroke="url(#brandGradient)" stroke-width="2.5" fill="white" fill-opacity="0.3"/>
    <line x1="34" y1="34" x2="40" y2="40" stroke="url(#brandGradient)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Lens glint -->
    <path d="M24 24 Q26 22, 28 24" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>
  
  <!-- Text: WareHouseLens -->
  <text x="48" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#1e293b">
    <tspan fill="#3B82F6">Ware</tspan><tspan fill="#1e293b">House</tspan><tspan fill="#3B82F6">Lens</tspan>
  </text>
</svg>
