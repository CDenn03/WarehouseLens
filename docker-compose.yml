# Local dev only — see docs/developer-guide.md Section 11 for how these services
# map onto the deployed environment (Railway + Neon). Hardcoded passwords are
# dev-only by design; deployed secrets live in Railway's variable store.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: wms
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: wms_dev_password
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms -d wms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --hostname=http://localhost:8080 --hostname-strict=false
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes:
      - keycloak-data:/opt/keycloak/data

  backend:
    build: ./backend
    env_file: .env
    environment:
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080/realms/warehouselens
      - KEYCLOAK_CLIENT_ID=warehouselens-backend
      # Apply pending migrations on boot so a new revision can't silently drift
      # from the running schema.  Set only here: the worker shares this image
      # and must not race the backend for the same DDL lock.
      - RUN_MIGRATIONS=1
      # Admin API access, used to provision tenant/platform admin accounts.
      # Matches the dev-only KEYCLOAK_ADMIN credentials on the keycloak service.
      - KEYCLOAK_ADMIN_URL=http://keycloak:8080
      - KEYCLOAK_REALM=warehouselens
      - KEYCLOAK_ADMIN_AUTH_REALM=master
      - KEYCLOAK_ADMIN_CLIENT_ID=admin-cli
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./backend:/srv
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      keycloak:
        condition: service_started
    ports: ["8000:8000"]

  worker:
    build: ./backend
    command: python -m app.worker
    env_file: .env
    depends_on: [postgres, redis]

  frontend:
    build:
      context: ./frontend
      target: dev
    env_file: .env
    environment:
      - CI=true
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on: [backend]
    extra_hosts:
      - "localhost:host-gateway"
    ports: ["3000:3000"]

volumes:
  pgdata:
  keycloak-data:
  frontend_node_modules:
